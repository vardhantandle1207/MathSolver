name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The test suite never touches the network or a model: the agent loop is
      # driven by a fake chat model, so CI needs the graph and SymPy, nothing else.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langgraph langchain-core sympy numpy python-dotenv pytest

      - name: Run tests
        run: pytest -q
